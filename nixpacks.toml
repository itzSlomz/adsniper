# Shared libraries + fonts for Puppeteer's bundled Chromium (PDF export).
# Ubuntu noble names (t64 transition). Arabic shaping comes from
# fonts-noto-core (includes Noto Naskh/Sans Arabic). Puppeteer downloads
# its browser into PUPPETEER_CACHE_DIR=/app/.puppeteer during npm install.
[phases.setup]
aptPkgs = [
  "libnss3", "libnspr4", "libatk1.0-0t64", "libatk-bridge2.0-0t64",
  "libcups2t64", "libdrm2", "libxkbcommon0", "libxcomposite1",
  "libxdamage1", "libxfixes3", "libxrandr2", "libgbm1", "libasound2t64",
  "libpango-1.0-0", "libcairo2",
  "fonts-noto-core", "fonts-noto-color-emoji",
]
